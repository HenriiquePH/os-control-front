<section class="pagina-ordens-visualizar">
  <header class="barra-superior">
    <span class="titulo-sistema">OS Control</span>
    <span class="usuario-logado">{{ usuarioLogado }}</span>
  </header>

  <aside class="barra-lateral">
    <nav class="menu-lateral">
      <a class="item-home" routerLink="/home" routerLinkActive="item-home-ativo" [routerLinkActiveOptions]="{ exact: true }">
        Home
      </a>
      <hr class="linha-menu" />

      <a class="item-menu" routerLink="/orcamentos" routerLinkActive="item-menu-ativo">
        <img class="icone-svg icone-menu" src="assets/icone-orcamentos.png" alt="" />
        <span>Or&ccedil;amentos</span>
      </a>
      <hr class="linha-menu" />

      <a class="item-menu" routerLink="/ordens-servico" routerLinkActive="item-menu-ativo">
        <img class="icone-svg icone-menu" src="assets/icone-ordem-servico.png" alt="" />
        <span>Ordens de Servi&ccedil;os</span>
      </a>
      <hr class="linha-menu" />

      <a class="item-menu" routerLink="/clientes" routerLinkActive="item-menu-ativo">
        <img class="icone-svg icone-menu" src="assets/icone-cliente.png" alt="" />
        <span>Clientes</span>
      </a>
      <hr class="linha-menu" />

      <a class="item-menu" routerLink="/tecnicos" routerLinkActive="item-menu-ativo">
        <img class="icone-svg icone-menu" src="assets/icone-tecnico.png" alt="" />
        <span>T&eacute;cnicos</span>
      </a>
      <hr class="linha-menu" />

      <a class="item-menu" routerLink="/pecas" routerLinkActive="item-menu-ativo">
        <img class="icone-svg icone-menu" src="assets/icone-peca.png" alt="" />
        <span>Pe&ccedil;as</span>
      </a>
      <hr class="linha-menu" />

      <a class="item-menu" routerLink="/servicos" routerLinkActive="item-menu-ativo">
        <img class="icone-svg icone-menu" src="assets/icone-servi%C3%A7o.png" alt="" />
        <span>Servi&ccedil;os</span>
      </a>
      <hr class="linha-menu" />
    </nav>

    <button class="botao-sair" type="button" (click)="sair()">
      <span class="circulo-icone-sair">
        <img class="icone-svg icone-sair" src="assets/icone-logout.png" alt="" />
      </span>
      <span class="texto-sair">Logout</span>
    </button>
  </aside>

  <main class="conteudo-ordens-visualizar">
    <div class="cabecalho-pagina">
      <a class="botao-voltar" routerLink="/ordens-servico" aria-label="Voltar para menu de OS">
        <img class="icone-svg icone-voltar" src="assets/icone-voltar-calendario.png" alt="" />
      </a>

      <h1 class="titulo-pagina">Visualizar ordens de servi&ccedil;o</h1>
    </div>

    <section class="barra-filtros">
      <div class="bloco-filtro bloco-filtro-cliente">
        <label class="rotulo-campo" for="filtro-cliente-os">Pesquisar por cliente</label>
        <div class="controle-pesquisa">
          <input
            class="entrada-campo entrada-cliente"
            id="filtro-cliente-os"
            type="text"
            [(ngModel)]="filtroCliente"
            [ngModelOptions]="{ standalone: true }"
          />
          <button class="botao-pesquisa" type="button" aria-label="Pesquisar por cliente">
            <img class="icone-svg icone-pesquisa" src="assets/icone-lupa.png" alt="" />
          </button>
        </div>
      </div>

      <div class="bloco-filtro">
        <label class="rotulo-campo" for="filtro-tecnico-os">T&eacute;cnico</label>
        <input
          class="entrada-campo"
          id="filtro-tecnico-os"
          type="text"
          [(ngModel)]="filtroTecnico"
          [ngModelOptions]="{ standalone: true }"
        />
      </div>

      <div class="bloco-filtro bloco-filtro-status">
        <label class="rotulo-campo" for="filtro-status-os">Status</label>
        <input
          class="entrada-campo"
          id="filtro-status-os"
          type="text"
          [(ngModel)]="filtroStatus"
          [ngModelOptions]="{ standalone: true }"
        />
      </div>

      <button class="botao-filtro" type="button" aria-label="Filtrar ordens de servico">
        <img class="icone-svg icone-filtro" src="assets/icone-filtro.png" alt="" />
      </button>
    </section>

    <section class="tabela-lista">
      <div class="cabecalho-tabela">
        <span>Id</span>
        <span>Data de abertura</span>
        <span>Cliente</span>
        <span>Ve&iacute;culo</span>
        <span>Status</span>
        <span>T&eacute;cnico</span>
        <span class="coluna-acoes" aria-hidden="true"></span>
      </div>

      <div class="corpo-tabela">
        <div class="linha-tabela" *ngFor="let ordem of ordensFiltradas">
          <span>{{ ordem.id }}</span>
          <span>{{ ordem.dataAbertura }}</span>
          <span>{{ ordem.cliente }}</span>
          <span>{{ ordem.veiculo }}</span>
          <span>{{ ordem.status }}</span>
          <span>{{ ordem.tecnico }}</span>

          <a class="botao-editar-ordem" [routerLink]="['/ordens-servico/editar', ordem.id]" aria-label="Editar ordem de servico">
            <img class="icone-svg icone-acao" src="assets/icone-editar-lapis.png" alt="" />
          </a>
        </div>

        <div class="linha-tabela linha-vazia" *ngFor="let _ of linhasVazias"></div>
      </div>
    </section>
  </main>
</section>
